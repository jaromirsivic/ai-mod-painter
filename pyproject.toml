[project]
name = "ai-mod-painter"
version = "0.1.0"
description = "View animation frames as stacked image layers: reorder, hide and mask layers, scrub or play the frames, zoom up to 64x."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyside6-essentials>=6.8,<7",
]

[project.scripts]
ai-mod-painter = "ai_mod_painter.app:main"

[project.gui-scripts]
ai-mod-painter-gui = "ai_mod_painter.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_mod_painter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
